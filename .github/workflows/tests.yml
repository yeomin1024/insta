# VERSION: v1.1.0 — 2026-10-15 — results 브랜치·inputs 업로드는 테스트 제외
name: tests
on:
  push:
    branches-ignore: [results]   # 실행기가 올리는 결과 브랜치에는 코드가 없다
    paths-ignore: ["inputs/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check insta_analyzer tests
      - run: pytest -q
