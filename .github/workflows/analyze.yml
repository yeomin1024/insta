# VERSION: v1.0.0 — 2026-10-15 — 최초 릴리스: GitHub에서 분석 코드를 받아 실행 → 결과를 results 브랜치에 업로드
#
# 실행 방법
#   - 수동: Actions 탭 → insta-analysis → Run workflow (소스/코드 버전/경쟁 계정 선택)
#   - 자동: 매주 월요일 08:53(KST) / inputs/ 폴더에 CSV를 올리면(push) 즉시 실행
# 필요한 설정 (Settings → Secrets and variables → Actions)
#   Secrets  : IG_ACCESS_TOKEN, IG_USER_ID (api 소스), RESULTS_TOKEN (결과를 '다른' 저장소에 올릴 때만, contents:write PAT)
#   Variables: RESULTS_REPO (기본: 이 저장소), RESULTS_BRANCH (기본: results), INSTA_SOURCE (예약 실행 소스, 기본 auto)
#              ALLOW_PUBLIC_RESULTS=true (공개 저장소에 실제 데이터 결과 업로드를 감수할 때만)
name: insta-analysis

on:
  workflow_dispatch:
    inputs:
      source:
        description: "데이터 소스 (auto: 토큰이 있으면 api → inputs/ CSV → demo)"
        type: choice
        options: [auto, api, csv, demo]
        default: auto
      code_ref:
        description: "분석 코드 버전(브랜치/태그/커밋). 비우면 이 워크플로가 실행된 커밋"
        required: false
        default: ""
      competitors:
        description: "경쟁 계정 사용자 이름(쉼표 구분, api 소스만)"
        required: false
        default: ""
  schedule:
    - cron: "53 23 * * 0"   # UTC 일 23:53 = KST 월 08:53
  push:
    paths: ["inputs/**.csv"]   # CSV를 올릴 때만(README 수정 등은 무시)

permissions:
  contents: write   # results 브랜치에 결과 커밋

concurrency:
  group: insta-analysis   # 동시에 두 번 돌며 결과가 꼬이지 않도록 직렬화
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 실행기(runner/)와 입력(inputs/, config.toml)만 받는다. 분석 코드는 실행기가 GitHub에서 따로 받아온다.
      - name: 실행기·입력 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 입력 CSV를 올린 시각(분석 기준 시각) 계산용
          sparse-checkout: |
            runner
            inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: API 응답 캐시 복원 (확정된 인사이트 재호출 방지)
        uses: actions/cache@v4
        with:
          path: .insta_runner/cache
          key: insta-api-${{ github.run_id }}
          restore-keys: insta-api-

      - name: 분석 코드 받기 → 실행 → 결과 업로드
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_TOKEN: ${{ secrets.RESULTS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IN_SOURCE: ${{ github.event_name == 'push' && 'csv' || inputs.source || vars.INSTA_SOURCE || 'auto' }}
          IN_CODE_REF: ${{ inputs.code_ref || github.sha }}
          IN_COMPETITORS: ${{ inputs.competitors }}
          IN_RESULTS_REPO: ${{ vars.RESULTS_REPO || github.repository }}
          IN_RESULTS_BRANCH: ${{ vars.RESULTS_BRANCH || 'results' }}
          IN_ALLOW_PUBLIC: ${{ vars.ALLOW_PUBLIC_RESULTS }}
          IN_EVENT: ${{ github.event_name }}
        run: |
          extra=()
          if [ "$IN_ALLOW_PUBLIC" = "true" ]; then extra+=(--allow-public-results); fi
          # 예약 실행인데 데이터 소스(토큰/CSV)가 없으면 합성 데이터 결과를 쌓지 않고 건너뜀
          if [ "$IN_EVENT" = "schedule" ]; then extra+=(--skip-auto-demo); fi
          python runner/run.py \
            --code-repo "$GITHUB_REPOSITORY" \
            --code-ref "$IN_CODE_REF" \
            --source "$IN_SOURCE" \
            --competitors "$IN_COMPETITORS" \
            --csv-dir inputs \
            --config config.toml \
            --results-repo "$IN_RESULTS_REPO" \
            --results-branch "$IN_RESULTS_BRANCH" \
            --install system \
            "${extra[@]}"
