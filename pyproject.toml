# VERSION: v1.1.0 — 2026-10-15 — 실행기 연동 버전
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-analyzer"
version = "1.1.0"
description = "인스타그램 콘텐츠 성과 분석기 — 조회수·팔로워를 늘리는 게시물 특성을 통계적으로 검증 (연구·교육용)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
images = ["pillow>=9.0"]
dev = ["pytest>=7", "pillow>=9.0", "ruff>=0.5"]

[project.scripts]
insta-analyzer = "insta_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["insta_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B905"]
